// 64-GPU rail-optimized Clos, 16 ports per GPU, 16 rail switches of 64 ports
topology = clos;
clos_gpus = 64;
clos_gpu_ports = 16;
clos_radix = 64;
clos_levels = 1;
routing_function = dest;
// 2x internal speedup removes switch-allocation (iSLIP) inefficiency, so results
// reflect topology and schedule, not the arbiter.
internal_speedup = 2.0;

// 16 B flits; packets of up to packet_size = 16 payload flits (256 B), no header
// flits (packet_header_flits = 0). NVSwitch-like buffering: 8 VCs x 256 flits (4 KB).
num_vcs = 8;
vc_buf_size = 256;
packet_size = 16;
packet_header_flits = 0;

sim_type = collective;
trace_out = /dev/null;
trace_order = rr;

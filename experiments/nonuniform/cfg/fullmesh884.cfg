// 884 full mesh, store-and-forward DimRotation (schedule: --types fullmesh)
topology = hyperx;
dim_sizes = {8,8,4};
routing_function = dor;

// 16 B flits; packets of up to packet_size = 16 payload flits (256 B), no header
// flits (packet_header_flits = 0). NVSwitch-like buffering: 8 VCs x 256 flits (4 KB).
num_vcs = 8;
vc_buf_size = 256;
packet_size = 16;
packet_header_flits = 0;

sim_type = collective;
trace_out = /dev/null;
trace_order = rr;

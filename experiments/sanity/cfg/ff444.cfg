// Built-in flattened butterfly 4x4x4, c = 1, all channel latencies 1.
topology = flatfly;
k = 4;
n = 3;
c = 1;
x = 4;
y = 4;
xr = 1;
yr = 1;
routing_function = ran_min;
use_noc_latency = 0;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_out = /dev/null;
trace_order = rr;

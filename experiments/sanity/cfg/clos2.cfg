// clos, one port per GPU, two levels wired like the 8-ary 2-tree: 8 leaves (8 GPU, 8 up), 8 spines x 8 ports.
topology = clos;
clos_gpus = 64;
clos_gpu_ports = 1;
clos_radix = 16;
clos_levels = 2;
routing_function = random;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_out = /dev/null;
trace_order = rr;

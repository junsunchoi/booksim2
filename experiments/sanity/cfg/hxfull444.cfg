// hyperx 4x4x4 full, one terminal per router, link latency 1 (matches ff444.cfg).
topology = hyperx;
dim_sizes = {4,4,4};
routing_function = dor;
hyperx_c = 1;
hyperx_link_latency = 1;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_out = /dev/null;
trace_order = rr;

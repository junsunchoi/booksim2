// multilinktorus 8x8, one terminal per router, link latency 2 (matches torus88.cfg).
// dor_multilinktorus needs num_vcs >= max hops = 8, so runs override num_vcs = 8 on both.
topology = multilinktorus;
dim_sizes = {8,8};
routing_function = dor;
multilinktorus_c = 1;
multilinktorus_link_latency = 2;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_out = /dev/null;
trace_order = rr;

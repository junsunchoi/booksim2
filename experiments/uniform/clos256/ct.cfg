// 256-GPU two-level rail-optimized Clos from 64-port switches, 16 ports per GPU:
// 8 pods of 32 GPUs x 16 L1 switches (one per rail, 32 GPU + 32 up ports),
// 2 rail groups (rails 0-7, 8-15) x 32 L2 switches (8 pods x 8 rails).
// Each message is striped over the 16 rails.
// One-shot uniform all-to-all, one message per GPU pair:
//   python3 a2a-tools/gen_schedule.py --dims 256 --types fullmesh --algo ct --dest-order asc -o experiments/uniform/clos256/a2a_ct_asc.txt
//   python3 a2a-tools/gen_schedule.py --dims 256 --types fullmesh --algo ct --dest-order shift -o experiments/uniform/clos256/a2a_ct_shift.txt
// routing_function = random | adaptive | dest (up-port selection).
// Lower bound: 255 x 64 / 16 = 1020 flits per GPU link.

topology = clos;
clos_gpus = 256;
clos_gpu_ports = 16;
clos_radix = 64;
clos_levels = 2;
routing_function = dest;

num_vcs = 8;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_file = experiments/uniform/clos256/a2a_ct_shift.txt;
trace_out = /dev/null;
trace_order = rr;

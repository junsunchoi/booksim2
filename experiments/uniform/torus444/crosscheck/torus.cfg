// Built-in BookSim 4x4x4 torus (kncube), one terminal per router, for cross-checking multilinktorus.
// use_noc_latency = 1 (default) gives torus flit/credit channel latency 2; inject/eject latency 1.

topology = torus;
k = 4;
n = 3;
routing_function = dim_order;
use_noc_latency = 1;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_file = experiments/uniform/torus444/a2a_snf.txt;
trace_order = rr;

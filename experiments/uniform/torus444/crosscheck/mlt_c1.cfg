// multilinktorus 4x4x4, matched to crosscheck/torus.cfg: one terminal per router, link latency 2.

topology = multilinktorus;
dim_sizes = {4,4,4};
routing_function = dor;
multilinktorus_c = 1;
multilinktorus_link_latency = 2;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_file = experiments/uniform/torus444/a2a_snf.txt;
trace_order = rr;

// 4x4x4 torus, uniform all-to-all, cut-through one-shot with DimRotation chunks
// Schedule: python3 a2a-tools/gen_schedule.py --dims 4,4,4 --types torus --algo ct -o experiments/uniform/torus444/a2a_ct.txt

topology = multilinktorus;
dim_sizes = {4,4,4};
routing_function = dor;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_file = experiments/uniform/torus444/a2a_ct.txt;
trace_out = experiments/uniform/torus444/a2a_ct.csv;
trace_order = rr;

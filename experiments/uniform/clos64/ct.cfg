// 64-GPU rail-optimized Clos, 16 ports per GPU: 16 rail switches with 64 ports
// (one level; port r of every GPU -> switch r), one-shot uniform all-to-all.
// Each message is striped over the 16 rails.
// Schedules (one message per GPU pair; the 64-node "full" dimension is only used
// to enumerate pairs, the Clos routes them):
//   python3 a2a-tools/gen_schedule.py --dims 64 --types fullmesh --algo ct --dest-order asc -o experiments/uniform/clos64/a2a_ct_asc.txt
//   python3 a2a-tools/gen_schedule.py --dims 64 --types fullmesh --algo ct --dest-order shift -o experiments/uniform/clos64/a2a_ct_shift.txt
// Lower bound: 63 x 256 / 16 = 1008 flits per GPU link.

topology = clos;
clos_gpus = 64;
clos_gpu_ports = 16;
clos_radix = 64;
clos_levels = 1;
routing_function = dest;

num_vcs = 8;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_file = experiments/uniform/clos64/a2a_ct_shift.txt;
trace_out = /dev/null;
trace_order = rr;

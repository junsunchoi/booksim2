// 8x8x4 full mesh (HyperX, 17 links per GPU), uniform all-to-all, direct
// one round per dimension + DimRotation
// Schedule: python3 a2a-tools/gen_schedule.py --dims 8,8,4 --types fullmesh --algo snf -o experiments/uniform/fullmesh884/a2a_snf.txt

topology = hyperx;
dim_sizes = {8,8,4};
routing_function = dor;

num_vcs = 6;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_file = experiments/uniform/fullmesh884/a2a_snf.txt;
trace_out = experiments/uniform/fullmesh884/a2a_snf.csv;
trace_order = rr;

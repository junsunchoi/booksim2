// 8x8x4 torus, uniform all-to-all, store-and-forward HalfRing + DimRotation
// Schedule: python3 a2a-tools/gen_schedule.py --dims 8,8,4 --types torus --algo snf -o experiments/uniform/torus884/a2a_snf.txt

topology = multilinktorus;
dim_sizes = {8,8,4};
routing_function = dor;

num_vcs = 10;
vc_buf_size = 32;
packet_size = 16;

sim_type = collective;
trace_file = experiments/uniform/torus884/a2a_snf.txt;
trace_out = experiments/uniform/torus884/a2a_snf.csv;
trace_order = rr;
